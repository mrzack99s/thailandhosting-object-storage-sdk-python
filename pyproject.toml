[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "thailandhosting-object-storage"
version = "1.1.0"
description = "Python SDK for ThailandHosting Object Storage"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = ["urllib3>=2.0"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
    "Typing :: Typed",
]

[project.urls]
Homepage = "https://www.thailandhosting.com"
Source = "https://github.com/mrzack99s/thailandhosting-object-storage-sdk-python"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
thailandhosting_objectstorage = ["py.typed"]
